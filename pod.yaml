apiVersion: v1
kind: Service
metadata:
  name: svc-aula-06-11
spec:
  type: NodePort
  selector:
    aplicacao: web
  ports:
    - name: http
      port: 8000        # porta do Service (pode continuar 8000)
      targetPort: 8001  # porta real da aplicação
      nodePort: 30000
---
apiVersion: v1
kind: Pod
metadata:
  name: aula-06-11
  labels:
    aplicacao: web
spec:
  initContainers:
    - name: espera-banco
      image: postgres:17
      command: ["sh", "-c", "until pg_isready -h svc-banco.default.svc.cluster.local -p 5432 -U devops; do echo aguardando banco; sleep 2; done"]
  containers:
    - image: eduardojscpucbr/tarefas:2.0
      name: web
      ports:
        - containerPort: 8001
      readinessProbe:
        tcpSocket:
          port: 8001
        initialDelaySeconds: 3
        periodSeconds: 5
      env:
        - name: DATABASE
          value: devops
        - name: DATABASE_PASSWORD
          value: password
        - name: DATABASE_ADDRESS
          value: svc-banco.default.svc.cluster.local
        - name: DATABASE_USERNAME
          value: devops
