# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: DevOps 30/10/26

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v3
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Lint with pylint
      run: |
        pylint --source-roots=. app
    - name: Test with pytest
      env:
        DATABASE_USERNAME: mock
        DATABASE_PASSWORD: mock
        DATABASE_ADDRESS: mock
        DATABASE: mock
      run: |
        pytest -vv

  entrega:
    name: entrega (push)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configura Docker
        uses: docker/setup-buildx-action@v3
      - name: Autenticação no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build e push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USER }}/tarefas:2.0

  deploy:
    name: deploy (Render)
    needs: [entrega, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-slim
    steps:
      - name: Deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsS -X GET "$RENDER_DEPLOY_HOOK"
